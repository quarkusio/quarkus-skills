# migration-spec.yaml — Canonical Migration Specification for Spring Boot → Quarkus
# Generated by: agents/02-migration-planning.prompt.md
# Schema version: 1.0
# This file is the binding contract between all migration agents.
#
# RULES:
#   - Populate every field. Use null only where no evidence was found in source code.
#   - Boolean detected_features flags drive which phases are active — never leave them null.
#   - Fields marked *** USER DECISION REQUIRED *** must be confirmed before agents proceed.
#   - The phases[] array controls execution order; tasks[] are delegated to sub-agents.
#   - decisions[] captures architectural choices made during planning for traceability.
#   - skip[] documents explicitly excluded scope — never skip silently.

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 1 — PROJECT IDENTITY
# ─────────────────────────────────────────────────────────────────────────────
project:
  name: null                      # target artifact name, e.g. myapp-quarkus
  description: null               # one-line description of the application
  source_path: null               # relative path to source project root
  target_path: null               # relative path to target project root

metadata:
  application: null               # from pom.xml artifactId
  version: null                   # from pom.xml version
  complexity: null                # low | medium | high | very_high
  generatedAt: null               # ISO-8601 date (set by planning agent)
  schema_version: "1.0"

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 1b — EXECUTION MODE
# ─────────────────────────────────────────────────────────────────────────────
# Resolved by the orchestrator in Phase 0 (see SKILL.md → resolution order):
#   skill argument  →  .quarkus-migration.yml  →  default (interactive).
# This is the EXECUTION axis and is distinct from migration_strategy.migration_mode
# (the full-vs-compat STRATEGY axis in SECTION 12).
execution:
  mode: interactive               # interactive | autonomous
                                  #   interactive — HARD STOP for `yes` after each phase; ask all technology decisions.
                                  #   autonomous  — no approval stops; agent chooses best-fit values for anything
                                  #                 not already provided; on failure, fix then document & continue.
  mode_source: default            # argument | config-file | default  (where `mode` was resolved from)
  strategy_source: null           # argument | config-file | ask | agent-selected
                                  #   how migration_strategy.migration_mode (the STRATEGY) was resolved.

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 2 — SOURCE TECHNOLOGY
# ─────────────────────────────────────────────────────────────────────────────
source_technology:
  framework: "Spring Boot"
  spring_boot_version: null       # e.g. "3.2.0" | "2.7.18"
  java_version: null              # e.g. "17" | "11" | "21"
  build_tool: null                # Maven | Gradle
  base_package: null              # e.g. com.example.myapp
  database: null                  # e.g. PostgreSQL | MySQL | H2
  messaging: null                 # e.g. Kafka | RabbitMQ | none
  web_framework: null             # Spring MVC | Spring WebFlux
  persistence: null               # Spring Data JPA | JPA | JDBC
  security: null                  # Spring Security | none
  source_repo: null               # absolute path to source repo root

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 3 — TARGET TECHNOLOGY
# ─────────────────────────────────────────────────────────────────────────────
target_technology:
  runtime: Quarkus
  quarkus_version: null           # resolved at runtime — set by planning agent (e.g. "3.15.1")
  java_version: "17"              # Quarkus 3.x minimum
  build_tool: null                # inherit from source_technology or set explicitly
  database: null                  # target database
  messaging: null                 # e.g. Quarkus SmallRye Reactive Messaging
  web_framework: null             # Quarkus REST (RESTEasy Reactive)
  persistence: null               # Hibernate ORM with Panache | Hibernate ORM
  target_repo: null               # absolute path to target repo root
  quarkus_extensions: []
  # Populated by planning agent from dependency-analysis.yaml.
  # Example entries (full migration):
  #   - quarkus-arc
  #   - quarkus-hibernate-orm-panache
  #   - quarkus-rest-jackson
  #   - quarkus-smallrye-reactive-messaging-kafka
  #   - quarkus-jdbc-postgresql
  # Spring compatibility mode extensions (all added when migration_mode: spring-compatibility,
  # each only when the corresponding feature is detected in the source project):
  #   - quarkus-spring-di               # @Service/@Component present
  #   - quarkus-spring-web              # spring_web detected
  #   - quarkus-spring-data-jpa         # spring_data_jpa detected
  #   - quarkus-spring-scheduled        # spring_scheduled detected
  #   - quarkus-spring-cache            # spring_cache detected
  #   - quarkus-spring-boot-properties  # @ConfigurationProperties present
  #   - quarkus-spring-tx               # Spring @Transactional import present
  #   - quarkus-spring-security         # spring_security detected

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 4 — DETECTED FEATURES (agent-controlled boolean flags)
# ─────────────────────────────────────────────────────────────────────────────
detected_features:
  spring_web: false               # @RestController, @Controller
  spring_data_jpa: false          # JpaRepository, @Entity
  spring_security: false          # SecurityConfig, @EnableWebSecurity
  spring_kafka: false             # @KafkaListener, KafkaTemplate
  spring_rabbitmq: false          # @RabbitListener, RabbitTemplate
  spring_jms: false               # @JmsListener
  spring_actuator: false          # spring-boot-starter-actuator
  spring_cloud: false             # Spring Cloud components
  spring_async: false             # @Async methods
  spring_scheduled: false         # @Scheduled methods
  spring_cache: false             # @Cacheable, @CacheEvict
  spring_validation: false        # @Valid, @Validated
  spring_webflux: false           # Reactive web with WebFlux

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 5 — DATABASE
# ─────────────────────────────────────────────────────────────────────────────
database:
  product: null                   # postgresql | mysql | h2 | mariadb | oracle
  driver: null                    # JDBC driver class
  url_pattern: null               # JDBC URL pattern from application.properties

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 6 — ENTITY INVENTORY
# ─────────────────────────────────────────────────────────────────────────────
entities: []
# Format per entry:
#   - name: Order
#     source: src/main/java/com/example/entity/Order.java
#     table: orders
#     pk_type: Long
#     relationships: []
#     notes: null

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 7 — SERVICE LAYER INVENTORY
# ─────────────────────────────────────────────────────────────────────────────
services: []
# Format per entry:
#   - name: OrderService
#     source: src/main/java/com/example/service/OrderService.java
#     type: "@Service"
#     target: src/main/java/com/example/service/OrderService.java
#     target_scope: "@ApplicationScoped"
#     notes: null

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 8 — REPOSITORY INVENTORY
# ─────────────────────────────────────────────────────────────────────────────
repositories: []
# Format per entry:
#   - name: OrderRepository
#     source: src/main/java/com/example/repository/OrderRepository.java
#     type: "JpaRepository"
#     entity: Order
#     target_type: "PanacheRepository"
#     custom_methods: []
#     notes: null

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 9 — MESSAGING
# ─────────────────────────────────────────────────────────────────────────────
messaging_listeners: []
# Format per entry:
#   - name: OrderListener
#     source: src/main/java/com/example/listener/OrderListener.java
#     type: "@KafkaListener"
#     topic: orders
#     target_annotation: "@Incoming(\"orders\")"
#     channel: orders

messaging_producers: []
# Format per entry:
#   - name: OrderProducer
#     source: src/main/java/com/example/producer/OrderProducer.java
#     type: "KafkaTemplate"
#     topic: orders
#     target_type: "@Channel Emitter"

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 10 — REST RESOURCES
# ─────────────────────────────────────────────────────────────────────────────
rest_controllers: []
# Format per entry:
#   - name: OrderController
#     source: src/main/java/com/example/controller/OrderController.java
#     path: /api/orders
#     endpoints: 5
#     target: src/main/java/com/example/resource/OrderResource.java
#     notes: null

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 11 — CONFIGURATION CLASSES
# ─────────────────────────────────────────────────────────────────────────────
configurations: []
# Format per entry:
#   - name: AppConfig
#     source: src/main/java/com/example/config/AppConfig.java
#     beans: []
#     target_strategy: "CDI @Produces"
#     notes: null

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 12 — MIGRATION STRATEGY
# ─────────────────────────────────────────────────────────────────────────────
migration_strategy:
  migration_mode: null            # *** THE STRATEGY (full-vs-compat axis) ***
                                  # Resolved value — user-decided in interactive mode; agent-selected from
                                  # discovered features in autonomous mode when not provided via argument or
                                  # .quarkus-migration.yml (`strategy:` field). See execution.strategy_source.
                                  # full-migration       — rewrite all Spring annotations to CDI/JAX-RS/Panache
                                  # spring-compatibility — keep Spring annotations via Quarkus extension bridges
  service_layer: null             # auto-set by planning agent:
                                  #   full-migration       → application-scoped-cdi
                                  #   spring-compatibility → spring-di-compat (if @Service/@Component present)
  repository_layer: null          # auto-set by planning agent:
                                  #   full-migration       → panache-repository | hibernate-orm-standard (user choice)
                                  #   spring-compatibility → spring-data-compat (if spring_data_jpa detected)
  rest_framework: null            # auto-set by planning agent:
                                  #   full-migration       → quarkus-rest | resteasy-classic | vertx-web (user choice)
                                  #   spring-compatibility → spring-web-compat (if spring_web detected)
  messaging_transport: null       # *** USER DECISION REQUIRED ***
                                  # kafka | amqp | artemis-jms | in-memory | none
  security_approach: null         # auto-set by planning agent:
                                  #   full-migration       → none | oidc | basic | jwt | oauth2 | ldap | custom | mtls (user choice)
                                  #   spring-compatibility → spring-security-compat (if spring_security detected)
  async_strategy: mutiny-uni      # mutiny-uni | cdi-asynchronous
  persistence: null               # *** SET BY PLANNING AGENT ***
                                  # hibernate-orm-panache | hibernate-orm
  view_layer: null                # *** USER DECISION REQUIRED (only if views detected) ***
                                  # qute        — migrate all views to Qute (recommended)
                                  # myfaces     — maintain JSF with Quarkus MyFaces
                                  # auto        — let agent decide based on file count

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 12b — COMPAT MODE FLAGS
# ─────────────────────────────────────────────────────────────────────────────
# Auto-derived from migration_mode by planning agent — do not set manually.
# Each flag is true only when migration_mode = spring-compatibility AND the
# corresponding feature is detected in the source project.
# Read by validators: passed as --compat-mode to the relevant validate subcommand.
compat_mode:
  spring_di: false               # true when @Service/@Component present
  spring_web: false              # true when spring_web detected
  spring_data_jpa: false         # true when spring_data_jpa detected
  spring_scheduled: false        # true when spring_scheduled detected
  spring_cache: false            # true when spring_cache detected
  spring_boot_properties: false  # true when @ConfigurationProperties present
  spring_tx: false               # true when Spring @Transactional import present
  spring_security: false         # true when spring_security detected

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 13 — MIGRATION PHASES
# ─────────────────────────────────────────────────────────────────────────────
phases:
  - phase: 0
    name: "Environment Preparation"
    agent: null
    enabled: true
    tasks:
      - Verify Java >= 17
      - Verify Maven >= 3.9
      - Kill lingering processes
      - Write migration-context.json

  - phase: 1
    name: "Discovery & Analysis"
    agent: "modules/discovery/discovery.md"
    enabled: true
    tasks:
      - Scan source project structure
      - Detect frameworks, features, and dependencies
      - Write repo-metadata.json and dependency-analysis.yaml

  - phase: 2
    name: "Migration Planning"
    agent: "modules/planning/migration-planning.md"
    enabled: true
    tasks:
      - Analyse discovery output
      - Choose migration mode (full-migration | spring-compatibility)
      - Write migration-spec.yaml

  - phase: 3
    name: "Project Bootstrap"
    agent: "modules/build/project-bootstrap.md"
    enabled: true
    tasks:
      - Create pom.xml with Quarkus BOM
      - Create application.properties skeleton
      - Set up directory structure
      - Run mvn clean compile

  - phase: 4
    name: "Database Migration"
    agent: "modules/code/database-and-persistence-migration.md"
    enabled: null              # set to true when detected_features.spring_data_jpa OR sql files present
    tasks:
      - Convert datasource properties
      - Migrate schema/data SQL files (import.sql or Flyway/Liquibase)
      - Validate datasource config and JDBC driver

  - phase: 5
    name: "Persistence Migration"
    agent: "modules/code/database-and-persistence-migration.md"
    enabled: null              # set to true when detected_features.spring_data_jpa is true
    tasks:
      - Migrate @Entity classes
      - Convert Spring Data repositories
      - Update @Transactional imports

  - phase: 6
    name: "Service Layer Migration"
    agent: "modules/code/service-migration.md"
    enabled: null              # set to true when service classes detected
    tasks:
      - Convert @Service to @ApplicationScoped
      - Replace @Autowired with @Inject
      - Replace @Value with @ConfigProperty
      - Handle @Async methods

  - phase: 7
    name: "Messaging Migration"
    agent: "modules/code/messaging-migration.md"
    enabled: null              # set to true when spring_kafka or spring_rabbitmq detected
    tasks:
      - Convert @KafkaListener to @Incoming
      - Convert KafkaTemplate to @Channel Emitter
      - Configure messaging in application.properties

  - phase: 8
    name: "Web Layer Migration"
    agent: "modules/code/web-layer-migration.md"
    enabled: null              # set to true when spring_web detected
    tasks:
      - Convert @RestController to @Path
      - Convert HTTP method annotations
      - Convert parameter annotations
      - Handle exception handlers

  - phase: "8b"
    name: "Web Views Migration"
    agent: "modules/frontend/web-views-migration.md"
    enabled: null              # set to true when JSP/JSF/Thymeleaf/FreeMarker templates detected
    tasks:
      - Count view files to determine strategy
      - Delegate to specialized frontend agent (jsp-qute / jsf-qute / jsf-myfaces / thymeleaf-qute / freemarker-qute)
      - Migrate managed beans to CDI
      - Update controllers for chosen view technology
      - Run UI migration validator

  - phase: 9
    name: "Configuration Migration"
    agent: "modules/configuration.md"
    enabled: true
    tasks:
      - Convert application.properties
      - Convert @Configuration to CDI @Produces
      - Create lifecycle hooks
      - Create Dockerfile

  - phase: 10
    name: "Testing Migration"
    agent: "modules/testing/testing.md"
    enabled: null              # set to true when @SpringBootTest/@WebMvcTest/@MockBean found in src/test/
    tasks:
      - Replace @SpringBootTest with @QuarkusTest
      - Replace @MockBean with @InjectMock
      - Replace TestRestTemplate with REST Assured
      - Replace @ActiveProfiles with @TestProfile
      - Run mvn package (with tests)

  - phase: 11
    name: "Validation"
    agent: "modules/testing/validation.md"
    enabled: true
    tasks:
      - Run mvn compile
      - Run mvn package
      - Start application
      - Run smoke tests

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 14 — ARCHITECTURAL DECISIONS
# ─────────────────────────────────────────────────────────────────────────────
decisions: []
# Format per entry:
#   - decision: "Use Hibernate ORM with Panache"
#     reason: "Simplifies repository pattern, reduces boilerplate"

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 15 — FILES TO SKIP
# ─────────────────────────────────────────────────────────────────────────────
skip: []
# Format per entry:
#   - path: "src/main/java/com/example/legacy/*"
#     reason: "Legacy code not in use"

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 15b — UNRESOLVED MAJOR ISSUES
# ─────────────────────────────────────────────────────────────────────────────
# Populated primarily in autonomous mode. When a phase cannot be completed cleanly
# (compile-fix retries exhausted, failed validation gate, blocking precondition),
# the orchestrator records it here and CONTINUES to the next phase instead of
# stopping. Surfaced in the final Migration Report.
unresolved_issues: []
# Format per entry:
#   - phase: "5-persistence"
#     issue: "OrderRepository.findByStatus could not be migrated to Panache"
#     files: ["src/main/java/com/example/OrderRepository.java"]
#     attempted_fixes: 3
#     severity: ERROR            # ERROR (blocking) | WARNING (non-blocking)

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 16 — ORCHESTRATOR POLICY
# ─────────────────────────────────────────────────────────────────────────────
# These values are DERIVED from execution.mode (SECTION 1b), not set independently:
#   interactive → require_user_acceptance_after_each_phase: true,  on_manual_review_required: pause-and-ask
#   autonomous  → require_user_acceptance_after_each_phase: false, on_manual_review_required: document-and-continue
approval_policy:
  require_user_acceptance_after_each_phase: true   # false when execution.mode = autonomous
  max_compile_fix_retries_per_file: 3
  on_manual_review_required: pause-and-ask         # document-and-continue when execution.mode = autonomous

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 17 — VERIFICATION RULES
# ─────────────────────────────────────────────────────────────────────────────
verification_rules:
  project-setup:
    - "pom.xml exists"
    - "application.properties exists"
    - "quarkus-maven-plugin is present"
    - "quarkus extensions match detected features"
    - "src/main/java directory exists"
    - "mvn compile succeeds"

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 18 — TRANSFORMATION LEDGER
# ─────────────────────────────────────────────────────────────────────────────
transformations:
  persistence-migration: []
  service-migration: []
  messaging-migration: []
  web-migration: []
  configuration-migration: []
